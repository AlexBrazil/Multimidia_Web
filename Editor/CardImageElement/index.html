<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador de CardImageElement → data.json</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>Gerador de <code>CardImageElement</code> para <code>data.json</code></h1>
    <p>Preencha e gere um objeto JSON compatível com <strong>card-image-element.js</strong>.</p>
  </header>

  <main class="site-main">
    <section class="panel">
      <h2 class="panel-title">Configurações básicas</h2>
      <div class="grid cols-3">
        <div class="field">
          <label for="source">Imagem (source)</label>
          <input id="source" type="text" placeholder="ex.: foto.jpg (em assets/images/)" />
        </div>
        <div class="field">
          <label for="fullSizeSource">Imagem em alta (fullSizeSource)</label>
          <input id="fullSizeSource" type="text" placeholder="opcional (ex.: foto_hd.jpg)" />
        </div>
        <div class="field">
          <label for="title">Título (title)</label>
          <input id="title" type="text" placeholder="opcional (ex.: Caminhão basculante)" />
        </div>
      </div>

      <div class="grid cols-3 gap-top">
        <div class="field">
          <label for="alt">Texto alternativo (alt)</label>
          <input id="alt" type="text" placeholder="descrição acessível da imagem" />
        </div>
        <div class="field">
          <label for="aspectRatio">Proporção (aspectRatio)</label>
          <input id="aspectRatio" type="text" placeholder="ex.: 16/9, 4/3 ou deixe vazio" />
        </div>
        <div class="field">
          <label for="maxWidth">Largura máx. (px) (maxWidth)</label>
          <input id="maxWidth" type="number" min="0" placeholder="0 = auto" />
        </div>
      </div>

      <div class="grid cols-3 gap-top">
        <div class="field">
          <label for="radius">Raio (radius)</label>
          <input id="radius" type="text" placeholder="número em px ou soft|pill|circle" />
        </div>
        <div class="field">
          <label for="borderWidth">Borda (px) (borderWidth)</label>
          <input id="borderWidth" type="number" min="0" value="1" />
        </div>
        <div class="field">
          <label for="borderColor">Cor da borda (borderColor)</label>
          <input id="borderColor" type="text" placeholder="#ddd" />
        </div>
      </div>

      <div class="grid cols-3 gap-top">
        <div class="field">
          <label for="shadow">Sombra (shadow)</label>
          <select id="shadow">
            <option value="sm">sm</option>
            <option value="md">md</option>
            <option value="lg">lg</option>
            <option value="none">none</option>
          </select>
        </div>
        <div class="checkbox">
          <input id="useMask" type="checkbox" checked />
          <label for="useMask">Aplicar máscara suave (useMask)</label>
        </div>
        <div class="field">
          <label for="openBehavior">Comportamento ao clicar (openBehavior)</label>
          <select id="openBehavior">
            <option value="modal">modal (detalhes)</option>
            <option value="zoom">zoom (abre imagem grande)</option>
            <option value="none">none (sem ação)</option>
          </select>
        </div>
      </div>

      <h2 class="panel-title gap-top">Legenda</h2>
      <div class="grid cols-2">
        <div class="field">
          <label for="caption">Legenda simples (caption)</label>
          <input id="caption" type="text" placeholder="opcional" />
        </div>
        <div class="field">
          <label for="captionStyle">Legenda como TextElement (styleName)</label>
          <input id="captionStyle" type="text" placeholder="ex.: caption" />
        </div>
      </div>
      <div class="field">
        <label for="captionText">Texto do TextElement (captionElement.text)</label>
        <textarea id="captionText" placeholder="Se informado, será usado captionElement em vez de caption"></textarea>
      </div>

      <h2 class="panel-title gap-top">Modal / Zoom</h2>
      <div class="grid cols-3">
        <div class="field">
          <label for="modalTitle">Título da modal (modalTitle)</label>
          <input id="modalTitle" type="text" placeholder="opcional" />
        </div>
        <div class="field">
          <label for="modalElements">modalElements (JSON)</label>
          <textarea id="modalElements" placeholder='[
  { "type": "TextElement", "styleName": "paragraph", "text": "Detalhe..." }
]'></textarea>
        </div>
        <div class="field">
          <label for="fullSizeHint">Dica: se for "zoom", fullSizeSource será usado (ou cai no source)</label>
          <input id="fullSizeHint" type="text" disabled placeholder="Informativo" />
        </div>
      </div>

      <h2 class="panel-title gap-top">Acessórios</h2>
      <div class="grid cols-3">
        <div class="checkbox">
          <input id="interactionHint" type="checkbox" />
          <label for="interactionHint">Exibir rótulo acima do card (interactionHint)</label>
        </div>
        <div class="field">
          <label for="hintDesktop">Texto (desktop)</label>
          <input id="hintDesktop" type="text" placeholder="clique para detalhes" />
        </div>
        <div class="field">
          <label for="hintMobile">Texto (mobile)</label>
          <input id="hintMobile" type="text" placeholder="toque para detalhes" />
        </div>
      </div>

      <div class="grid cols-3 gap-top">
        <div class="checkbox">
          <input id="showInfoBadge" type="checkbox" checked />
          <label for="showInfoBadge">Mostrar badge "i" quando houver info extra</label>
        </div>
        <div class="field">
          <label for="badgePosition">Posição do badge</label>
          <select id="badgePosition">
            <option value="top-right">top-right</option>
            <option value="top-left">top-left</option>
            <option value="bottom-right">bottom-right</option>
            <option value="bottom-left">bottom-left</option>
          </select>
        </div>
        <div class="field">
          <label for="clickSound">Som de clique (JSON)</label>
          <input id="clickSound" type="text" placeholder='{"src":"click.mp3","volume":0.6}' />
        </div>
      </div>

      <div class="actions gap-top">
        <button class="btn primary" id="gen">Gerar JSON</button>
        <button class="btn" id="copy">Copiar</button>
        <button class="btn" id="download">Baixar .json</button>
        <button class="btn warn" id="reset">Resetar</button>
      </div>

      <div class="field gap-top">
        <label for="out">Saída JSON</label>
        <pre class="output" id="out">{/* clique em "Gerar JSON" */}</pre>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    Compatível com o pipeline do <code>Multimidia_Web</code>.
  </footer>

  <script src="app.js"></script>
</body>
</html>
