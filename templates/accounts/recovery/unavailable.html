{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação indisponível</title>
    <link rel="stylesheet" href="{% static 'css/core/base.css' %}">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
        }
        .card {
            width: 100%;
            max-width: 520px;
            padding: 36px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.92);
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.45);
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 16px;
        }
        p {
            margin-bottom: 24px;
            color: rgba(248, 250, 252, 0.78);
            line-height: 1.6;
        }
        button {
            padding: 12px 22px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #0f172a;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Em construção</h1>
        <p>O processo automático de recuperação de acesso está em desenvolvimento. Clique abaixo para ser avisado assim que estiver disponível.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Quero ser avisado</button>
        </form>
    </div>
</body>
</html>
